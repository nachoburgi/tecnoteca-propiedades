<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp · Tecnoteca Propiedades</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: #d1d7db; height: 100vh; display: grid; place-items: center; }
  .wa { width: min(480px, 100%); height: min(860px, 100vh); display: flex; flex-direction: column; background: #efeae2; box-shadow: 0 10px 40px rgba(0,0,0,.25); overflow: hidden; }
  @media (min-width: 520px) { .wa { border-radius: 14px; height: min(820px, calc(100vh - 32px)); } }
  header { background: #008069; color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .av { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  .av svg { width: 26px; height: 26px; }
  header b { display: block; font-size: 1.02rem; }
  header small { opacity: .85; font-size: .82rem; }
  .ok { margin-left: 4px; font-size: .8rem; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    background-color: #efeae2; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px; }
  .aviso { align-self: center; background: #ffeecd; color: #54656f; font-size: .78rem; text-align: center; padding: 6px 12px; border-radius: 8px; margin: 4px 0 10px; max-width: 90%; }
  .dia { align-self: center; background: #fff; color: #54656f; font-size: .78rem; padding: 4px 10px; border-radius: 8px; margin-bottom: 6px; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
  .m { max-width: 82%; padding: 6px 9px 4px; border-radius: 8px; font-size: .95rem; line-height: 1.35; white-space: pre-wrap; box-shadow: 0 1px .5px rgba(0,0,0,.13); animation: in .18s ease; word-wrap: break-word; }
  .m .h { float: right; margin: 6px 0 -2px 10px; font-size: .68rem; color: #667781; }
  .yo { align-self: flex-end; background: #d9fdd3; }
  .el { align-self: flex-start; background: #fff; }
  .tic { color: #53bdeb; font-size: .78rem; margin-left: 2px; }
  .typing i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #9aa5ab; margin: 4px 2px; animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  form { display: flex; gap: 8px; padding: 8px 10px; background: #f0f2f5; }
  input { flex: 1; border: 0; border-radius: 22px; padding: 12px 16px; font-size: 1rem; outline: none; }
  button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #008069; color: #fff; font-size: 1.2rem; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="wa">
  <header>
    <div class="av"><svg viewBox="0 0 24 24" fill="#c8102e"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg></div>
    <div><b>Tecnoteca Propiedades<span class="ok">✔️</span></b><small id="estado">en línea</small></div>
  </header>
  <div id="msgs">
    <div class="aviso">🔒 Cuenta de empresa. Te atiende el equipo comercial con ayuda de IA; un asesor puede sumarse a la charla en cualquier momento.</div>
    <div class="dia">HOY</div>
  </div>
  <form id="f"><input id="in" placeholder="Escribí un mensaje" autocomplete="off"><button id="env" aria-label="Enviar">➤</button></form>
</div>
<script>
const $ = s => document.querySelector(s);
const sid = new URLSearchParams(location.search).get('sid') || 'wa-' + Date.now().toString(16);
const msgs = $('#msgs');
const hora = () => new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const esperar = ms => new Promise(r => setTimeout(r, ms));
function burbuja(texto, quien) {
  const d = document.createElement('div');
  d.className = 'm ' + quien;
  d.textContent = texto;
  d.insertAdjacentHTML('beforeend', `<span class="h">${hora()}${quien === 'yo' ? '<span class="tic">✓✓</span>' : ''}</span>`);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}
let ocupado = false;
async function mandar(texto) {
  texto = texto.trim(); if (!texto || ocupado) return;
  ocupado = true; $('#env').disabled = true;
  burbuja(texto, 'yo');
  await esperar(700);
  $('#estado').textContent = 'escribiendo…';
  const t = document.createElement('div'); t.className = 'm el typing'; t.innerHTML = '<i></i><i></i><i></i>';
  msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight;
  let resp = 'Perdón, se me cortó un segundo. ¿Me lo repetís?';
  try { const r = await fetch('/api/wa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid, mensaje: texto }) }); const j = await r.json(); if (j.texto) resp = j.texto; } catch {}
  // Como una persona: cada mensaje llega por separado, con su tiempo de "escribiendo…"
  const partes = resp.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  for (let i = 0; i < partes.length; i++) {
    if (i > 0) { msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight; await esperar(Math.min(2600, 700 + partes[i].length * 18)); }
    t.remove(); burbuja(partes[i], 'el');
  }
  t.remove();
  $('#estado').textContent = 'en línea';
  ocupado = false; $('#env').disabled = false; $('#in').focus();
}
$('#f').addEventListener('submit', e => { e.preventDefault(); const v = $('#in').value; $('#in').value = ''; mandar(v); });
// Arranca con el resumen que el cliente "manda" desde la web
(async () => {
  let texto = 'Hola! Vengo de la web de Tecnoteca y quiero hacer una consulta 🏠';
  try { const j = await (await fetch('/api/resumen/' + encodeURIComponent(sid))).json(); if (j.texto) texto = j.texto; } catch {}
  await esperar(500);
  mandar(texto);
})();
</script>
</body>
</html>
